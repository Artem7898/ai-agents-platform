# Optional dedicated local infrastructure. Never merge this into the main compose file.
name: agents-ticket-triage-demo
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_USER: triage
      POSTGRES_PASSWORD: local-triage-only
      POSTGRES_DB: triage
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - triage-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 3s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama:0.6.5
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - triage-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  triage-postgres:
  triage-models:
