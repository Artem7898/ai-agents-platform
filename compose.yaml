# Local development. Production settings and credentials must be supplied separately.
x-app: &app
  build: .
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev_postgres
    DATABASE_URL: postgresql://agents:local-development-only@postgres:5432/agents
    ALLOWED_HOSTS: '["localhost","127.0.0.1","web"]'

services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: agents
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents -d agents"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    <<: *app
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    <<: *app
    command: ["python", "manage.py", "runworker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
