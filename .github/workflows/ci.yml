name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: agents_test
          POSTGRES_USER: agents
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agents -d agents_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://agents:ci-only@127.0.0.1:5432/agents_test
      CONSOLE_BROWSER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --frozen --all-extras ruff check .
      - run: uv run --frozen --all-extras pyright
      - run: uv run --frozen --all-extras python manage.py check
      - run: uv run --frozen --all-extras python manage.py makemigrations --check --dry-run
      - run: uv run --frozen --all-extras pytest
      - run: uv build --wheel
      - run: uv run --frozen --all-extras python scripts/wheel_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-browser-results
          path: frontend/test-results/
          retention-days: 7
