[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-agents-platform"
version = "1.0.0"
description = "A typed Django workflow engine for AI agents with durable background execution."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Artem Alimpiev", email = "alimpievne@gmail.com"}]
license = "MIT"
dependencies = [
    "django>=5.2,<5.3",
    "django-nova[drf,fastapi,tracing,observability] @ git+https://github.com/Artem7898/django-nova.git@443efb7299c059d4fc7dc6c4b420de893412e355",
    "django-cors-headers>=4.7,<5",
    "django-unfold>=0.40,<1",
    "dj-database-url>=2.3,<4",
    "whitenoise>=6.8,<7",
    "redis>=5,<8",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5,<3",
    "djangorestframework>=3.16,<3.17",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=2.54,<3",
    "uvicorn[standard]>=0.30,<1",
    "uvloop>=0.19,<1; sys_platform != 'win32'",
    "psycopg[binary]>=3.2,<4",
    "opentelemetry-api>=1.24,<2",
    "opentelemetry-sdk>=1.24,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24,<2",
    "opentelemetry-instrumentation-django>=0.45b0,<1",
    "opentelemetry-instrumentation-httpx>=0.45b0,<1",
    "structlog>=24.1,<27",
]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
gcp = ["google-cloud-secret-manager>=2.23,<3", "google-crc32c>=1.6,<2"]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-django>=4.9,<5",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1",
    "ruff>=0.11,<1",
    "pyright>=1.1.400,<2",
    "build>=1.2,<2",
    "django-stubs>=5.2,<6",
    "django-stubs-ext>=5.2,<6",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.hatch.build]
artifacts = ["src/console/static/console/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/config", "/tests", "/frontend", "/manage.py", "/README.md", "/README_RU.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = ["**/migrations", "**/admin.py"]
reportMissingTypeStubs = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
pythonpath = ["."]
markers = ["postgresql: requires PostgreSQL row-lock semantics"]
